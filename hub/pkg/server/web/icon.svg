<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161a"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3b8ff"/>
      <stop offset="50%" stop-color="#6e8efb"/>
      <stop offset="100%" stop-color="#4a6cf7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4a6cf7" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#262b35" stroke-width="4"/>
  <g filter="url(#shadow)">
    <!-- Ominull Null Emblem (Ø) -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="url(#glow)" stroke-width="36"/>
    <line x1="140" y1="372" x2="372" y2="140" stroke="url(#glow)" stroke-width="36" stroke-linecap="round"/>
  </g>
</svg>
