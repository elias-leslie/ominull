<!DOCTYPE html>
<html lang="en" data-theme="ash">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ominull Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2314161A'/%3E%3Ccircle cx='8' cy='8' r='4.2' fill='none' stroke='%238FA9E8' stroke-width='1.4'/%3E%3Cpath d='M5 11 11 5' stroke='%238FA9E8' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script nonce="{{CSP_NONCE}}">
/* Serve-time substitution. The hub replaces these two tokens before it writes
   the document; they are template placeholders, never checked-in values. */
window.OMINULL = { key: "{{ADMIN_KEY}}", version: "{{HUB_VERSION}}", operator: "{{OPERATOR}}", role: "{{OPERATOR_ROLE}}" };
</script>
<script nonce="{{CSP_NONCE}}">
/* Apply the stored theme before first paint so the console never flashes Ash
   at an operator who chose Phosphor. Storage can throw (private mode, blocked
   site data), so a failure must still leave a correct default in place. */
(function () {
  var t = "ash";
  try {
    var v = localStorage.getItem("ominull.theme");
    if (v === "graphite" || v === "bunker" || v === "ash" || v === "phosphor") t = v;
  } catch (e) { /* keep the default */ }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-assets" viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/>
    <path d="M7 7h.01M7 17h.01"/>
  </symbol>
  <symbol id="i-discovery" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
  </symbol>
  <symbol id="i-topology" viewBox="0 0 24 24">
    <circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="18" r="2.4"/>
    <path d="M12 7.4 6.4 15.8M12 7.4l5.6 8.4M7.4 18h9.2"/>
  </symbol>
  <symbol id="i-traffic" viewBox="0 0 24 24">
    <path d="M3 17l4-6 4 3 4-8 6 5"/>
  </symbol>
  <symbol id="i-policy" viewBox="0 0 24 24">
    <path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6z"/>
  </symbol>
  <symbol id="i-audit" viewBox="0 0 24 24">
    <path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/>
  </symbol>
  <symbol id="i-access" viewBox="0 0 24 24">
    <circle cx="9" cy="9" r="3.2"/><path d="M3.8 19c.6-3 2.7-4.6 5.2-4.6s4.6 1.6 5.2 4.6"/><path d="M15.5 8.5h5M18.5 8.5v4"/>
  </symbol>
  <symbol id="i-alert" viewBox="0 0 24 24">
    <path d="M12 3a5 5 0 0 0-5 5c0 5-2 6-2 6h14s-2-1-2-6a5 5 0 0 0-5-5z"/><path d="M10.5 19a2 2 0 0 0 3 0"/>
  </symbol>
  <symbol id="i-copilot" viewBox="0 0 24 24">
    <rect x="4" y="7" width="16" height="12" rx="2"/><path d="M12 3v4M9 12h.01M15 12h.01M9.5 16h5"/>
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="6"/><path d="M19 19l-3.5-3.5"/>
  </symbol>
  <symbol id="i-dots" viewBox="0 0 24 24">
    <path d="M6 12h.01M12 12h.01M18 12h.01"/>
  </symbol>
  <symbol id="i-twist" viewBox="0 0 24 24">
    <path d="M6 9l6 6 6-6"/>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24">
    <path d="M6 6l12 12M18 6L6 18"/>
  </symbol>
  <symbol id="i-copy" viewBox="0 0 24 24">
    <rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M15 6H5.5A1.5 1.5 0 0 0 4 7.5V16"/>
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24">
    <path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4h-4"/>
  </symbol>
  <symbol id="i-download" viewBox="0 0 24 24">
    <path d="M12 4v10"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/>
  </symbol>
  <symbol id="i-external" viewBox="0 0 24 24">
    <path d="M14 5h5v5"/><path d="M19 5l-8 8"/><path d="M18 14v5H5V6h5"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24">
    <path d="M5 12.5l4.5 4.5L19 7"/>
  </symbol>
  <symbol id="i-lock" viewBox="0 0 24 24">
    <rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/>
  </symbol>
  <symbol id="i-unlock" viewBox="0 0 24 24">
    <rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8.5 11V8a3.5 3.5 0 0 1 6.7-1.5"/>
  </symbol>
  <symbol id="i-theme" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8"/><path d="M12 4v16"/>
  </symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24">
    <path d="M5 12h13"/><path d="M13 7l5 5-5 5"/>
  </symbol>
  <symbol id="i-tag" viewBox="0 0 24 24">
    <path d="M4 11V5h6l9 9-6 6z"/><path d="M7.5 8h.01"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24">
    <path d="M12 5v14M5 12h14"/>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24">
    <path d="M5 7h14"/><path d="M9 7V5h6v2"/><path d="M7 7l1 13h8l1-13"/>
  </symbol>

  <!-- State glyphs. Every state renders stripe + glyph + word, so these must be
       distinguishable by shape alone at 12px. -->
  <symbol id="g-online" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor" stroke="none"/></symbol>
  <symbol id="g-offline" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></symbol>
  <symbol id="g-watch" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 6a6 6 0 0 0 0 12z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="g-quarantine" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/><rect x="9" y="9" width="6" height="6" fill="currentColor" stroke="none"/></symbol>
  <symbol id="g-unknown" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" stroke-dasharray="2.6 2.4"/></symbol>
</svg>

<div class="app">

  <nav class="rail" aria-label="Console sections">
    <div class="rail-mark" aria-hidden="true">&Oslash;</div>

    <button class="rail-btn" type="button" data-section="assets" aria-current="true">
      <svg class="ic"><use href="#i-assets"/></svg>
      <span class="tip" aria-hidden="true">Assets</span>
      <span class="sr">Assets</span>
    </button>
    <button class="rail-btn" type="button" data-section="discovery" aria-current="false">
      <svg class="ic"><use href="#i-discovery"/></svg>
      <span class="tip" aria-hidden="true">Discovery</span>
      <span class="sr">Discovery</span>
    </button>
    <button class="rail-btn" type="button" data-section="topology" aria-current="false">
      <svg class="ic"><use href="#i-topology"/></svg>
      <span class="tip" aria-hidden="true">Topology</span>
      <span class="sr">Topology</span>
    </button>
    <button class="rail-btn" type="button" data-section="traffic" aria-current="false">
      <svg class="ic"><use href="#i-traffic"/></svg>
      <span class="tip" aria-hidden="true">Traffic</span>
      <span class="sr">Traffic</span>
    </button>
    <button class="rail-btn" type="button" data-section="policy" aria-current="false">
      <svg class="ic"><use href="#i-policy"/></svg>
      <span class="tip" aria-hidden="true">Policy</span>
      <span class="sr">Policy</span>
    </button>
    <button class="rail-btn" type="button" data-section="audit" aria-current="false">
      <svg class="ic"><use href="#i-audit"/></svg>
      <span class="tip" aria-hidden="true">Audit</span>
      <span class="sr">Audit</span>
    </button>
    <!-- Removed from the rail entirely for anyone who is not an administrator.
         The hub refuses the routes behind it regardless; hiding the button keeps
         the console from offering a door that will not open. -->
    <button class="rail-btn" type="button" data-section="access" aria-current="false" id="rail-access" hidden>
      <svg class="ic"><use href="#i-access"/></svg>
      <span class="tip" aria-hidden="true">Access</span>
      <span class="sr">Access</span>
    </button>

    <span class="rail-gap"></span>

    <div class="rail-foot">
      <span class="health" id="health" data-state="ok" title="Hub healthy">
        <span class="pip"></span>
        <span class="sr" id="health-word">Hub healthy</span>
      </span>
      <button class="theme-btn" type="button" id="theme-btn" aria-haspopup="true" aria-expanded="false">
        <i class="sw" id="theme-sw-1"></i><i class="sw" id="theme-sw-2"></i>
        <i class="sw" id="theme-sw-3"></i><i class="sw" id="theme-sw-4"></i>
        <span class="sr">Theme</span>
      </button>
    </div>
  </nav>

  <div class="pane">
    <header class="topbar">
      <div class="crumb"><span id="crumb-main">Assets</span> <span class="sub" id="crumb-sub"></span></div>

      <button class="omni" type="button" id="omni">
        <svg class="ic ic-s"><use href="#i-search"/></svg>
        <span class="fill">Jump to host, action, or IP</span>
        <kbd id="omni-kbd">Ctrl K</kbd>
      </button>

      <span id="topbar-actions"></span>

      <span class="ver" id="signed-in" title="Signed in as"></span>

      <span class="ver" id="hub-version" title="Hub build"></span>

      <button class="btn btn-icon" type="button" id="btn-alerts" aria-expanded="false">
        <svg class="ic"><use href="#i-alert"/></svg>
        <span class="count-pip" id="alert-count" data-n="0">0</span>
        <span class="sr">Alerts</span>
      </button>
      <button class="btn btn-icon" type="button" id="btn-copilot" aria-expanded="false">
        <svg class="ic"><use href="#i-copilot"/></svg>
        <span class="sr">Copilot</span>
      </button>
    </header>

    <div class="strip" id="strip" role="group" aria-label="Filters"></div>

    <main class="view" id="view"></main>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
