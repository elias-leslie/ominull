name: Console native-memory attribution
on: workflow_dispatch
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npm --prefix web-build ci --ignore-scripts
      - run: node web-build/node_modules/playwright/cli.js install --with-deps chromium
      - run: xvfb-run --auto-servernum node scripts/profile-console-memory.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-memory-profile
          path: build/memory-profile/
