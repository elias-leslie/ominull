name: Ominull CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-hub:
    name: Hub Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: hub/go.sum

      - name: Run Go Tests
        run: |
          cd hub
          go test -v -race ./...

  build-matrix:
    name: Cross-Platform Build & Package Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Toolchain (mingw-w64, osslsigncode, zip, clang)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 clang llvm osslsigncode zip

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build & Package Release Artifacts
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/package_release.sh ${{ github.ref_name }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ominull-release-packages
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
