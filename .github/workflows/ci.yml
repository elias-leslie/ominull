name: Ominull CI Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-hub:
    name: Go Hub Unit & Behavioral Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: hub/go.sum

      - name: Run Go Test Suite
        run: |
          cd hub
          go test -v -race ./...

  test-agent-dpi:
    name: C Agent & Stream DPI Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile and Test DPI Parser
        run: |
          gcc -O2 -Wall -Wextra -o /tmp/test_dpi agent/tests/test_dpi.c
          /tmp/test_dpi

      - name: Compile Linux Native Agent
        run: |
          mkdir -p agent/bin
          gcc -O2 -Wall -Wextra -o agent/bin/ominull-agent agent/linux/main.c

  build-packages:
    name: Cross-Platform Release Packaging
    runs-on: ubuntu-latest
    needs: [test-hub, test-agent-dpi]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Packaging Utilities (dpkg-dev, zip)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev zip

      - name: Build Cross-Platform Packages
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/build-packages.sh

      - name: Verify SHA256 Checksums
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
