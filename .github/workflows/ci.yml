name: Ominull CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  version-consistency:
    name: Release Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The retained hub and two endpoint agents must agree, or the fleet is
      # offered a self-update package the hub cannot serve.
      - name: Verify every version site matches VERSION
        run: |
          chmod +x ./scripts/version.sh
          ./scripts/version.sh check

      - name: Release HTTP headers and frozen-cohort regression tests
        run: |
          python3 scripts/test-release-headers.py
          python3 scripts/test-release-convergence.py

  test-topology:
    name: Topology and console (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      OMINULL_TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm --prefix web-build ci --ignore-scripts
      - run: web-build/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - run: bash scripts/check-topology.sh
      - name: Preserve sanitized browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-failure-evidence-${{ matrix.browser }}
          path: |
            build/console-failure.png
            build/console-trace.zip
          if-no-files-found: ignore
      - name: Preserve sanitized performance measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-performance-${{ matrix.browser }}
          path: |
            build/console-performance.json
            build/console-design/
          if-no-files-found: ignore

  test-hub:
    name: Go Hub Unit & Behavioral Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum

      - name: Install hub native test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Run Go Test Suite
        run: |
          cd hub
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -v -race ./...

      - name: Verify isolated IPv6 packet capture
        run: bash scripts/test-ipv6-monitor.sh

      - name: Check reachable Go vulnerabilities
        working-directory: hub
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  test-agents:
    name: Retained Native Agent Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum

      - name: Install Linux BPF build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang libbpf-dev libelf-dev linux-tools-common linux-tools-generic mingw-w64 libcurl4-openssl-dev
          bash scripts/build-bpf.sh

      - name: Compile and Run Linux Feedback Loops
        run: |
          mkdir -p build
          gcc -O2 -Wall -Wextra -Wformat=2 -Iagent/include \
            -o build/test_baseline agent/tests/test_baseline.c -lbpf -lcurl
          build/test_baseline
          gcc -O2 -Wall -Wextra -Wformat=2 -Iagent/include \
            -o build/test_linux_collector agent/tests/test_linux_collector.c -lbpf -lcurl
          build/test_linux_collector
          bash scripts/test-native-telemetry.sh
          bash scripts/test-native-ipv6.sh
          gcc -O2 -Wall -Wextra -Wformat=2 -Iagent/include \
            -o build/test_der_sig agent/tests/test_der_sig.c
          build/test_der_sig

      - name: Build canonical retained binaries
        run: bash scripts/build.sh

      - name: Upload nonprivileged Windows fixtures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-native-fixtures
          if-no-files-found: error
          path: |
            build/test_windows_telemetry_json.exe
            build/test_windows_ipv6_json.exe
            build/test_windows_adapter.exe
            build/test_wfp_transaction.exe

  test-windows-native:
    name: Native Windows serialization, adapter, and transaction fixtures
    runs-on: windows-latest
    needs: test-agents
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-native-fixtures
          path: build
      - name: Execute fixtures on Windows
        shell: pwsh
        run: ./scripts/test-native-windows.ps1

  build-packages:
    name: Cross-Platform Release Packaging
    runs-on: ubuntu-latest
    needs: [version-consistency, test-hub, test-agents, test-topology, test-windows-native]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum

      - name: Install canonical packaging and BPF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev wixl msitools mingw-w64 libcurl4-openssl-dev clang libbpf-dev libelf-dev linux-tools-common linux-tools-generic

      - name: Build Cross-Platform Packages
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/build-packages.sh

      - name: Verify Native Package Identities
        run: |
          python3 - <<'PY'
          import csv
          import io
          import subprocess
          from pathlib import Path

          version = Path("VERSION").read_text().strip()
          for name in ("ominull-agent", "ominull-hub"):
              package = f"dist/{name}_{version}_amd64.deb"
              for field, expected in (("Package", name), ("Version", version), ("Architecture", "amd64")):
                  actual = subprocess.check_output(["dpkg-deb", "--field", package, field], text=True).strip()
                  assert actual == expected, (package, field, actual, expected)

          msi = f"dist/ominull-agent-windows-{version}.msi"
          def table(name):
              output = subprocess.check_output(["msiinfo", "export", msi, name], text=True)
              rows = list(csv.reader(io.StringIO(output), delimiter="\t"))
              assert len(rows) > 3, f"Empty MSI {name} table"
              return [dict(zip(rows[0], row, strict=True)) for row in rows[3:]]

          properties = {row["Property"]: row["Value"] for row in table("Property")}
          assert properties["ProductName"] == "Ominull Agent"
          assert properties["ProductVersion"] == version
          files = {row["File"]: row for row in table("File")}
          for file_id in ("AgentExe", "WfpExe"):
              assert int(files[file_id]["FileSize"]) > 0
          print(f"Verified Linux and Windows package identities and MSI payloads for {version}")
          PY

  console-soak:
    name: Thirty minute throttled console soak
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npm --prefix web-build ci --ignore-scripts
      - run: web-build/node_modules/.bin/playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum node scripts/soak-console.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: console-soak
          path: build/console-soak.json

  installed-pwa:
    name: Installed Chromium PWA lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npm --prefix web-build ci --ignore-scripts
      - run: web-build/node_modules/.bin/playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum node scripts/check-installed-pwa.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: installed-pwa
          path: build/installed-pwa.json
