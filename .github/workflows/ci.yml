name: Ominull CI Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  version-consistency:
    name: Release Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The retained hub and two endpoint agents must agree, or the fleet is
      # offered a self-update package the hub cannot serve.
      - name: Verify every version site matches VERSION
        run: |
          chmod +x ./scripts/version.sh
          ./scripts/version.sh check

  test-hub:
    name: Go Hub Unit & Behavioral Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: hub/go.sum

      - name: Run Go Test Suite
        run: |
          cd hub
          go test -v -race ./...

  test-agents:
    name: Retained Native Agent Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile and Run Linux Feedback Loops
        run: |
          mkdir -p build
          gcc -O2 -Wall -Wextra -Wformat=2 -Iagent/include \
            -o build/test_baseline agent/tests/test_baseline.c -lcurl
          build/test_baseline
          gcc -O2 -Wall -Wextra -Wformat=2 -Iagent/include \
            -o build/test_linux_collector agent/tests/test_linux_collector.c -lcurl
          build/test_linux_collector
          gcc -O2 -Wall -Wextra -Wformat=2 -Iagent/include \
            -o build/test_der_sig agent/tests/test_der_sig.c
          build/test_der_sig
          gcc -O2 -Wall -Wextra -Wformat=2 -Iagent/include \
            -o build/ominulld agent/linux/main.c -lcurl

      - name: Install mingw-w64 Cross Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64

      - name: Compile Windows Native Agent
        run: |
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Wformat=2 -DOMINULL_WFP_EMBEDDED \
            -Iagent/include -o build/ominulld.exe \
            agent/src/main.c agent/src/hub_client.c agent/src/hub_tls.c \
            agent/src/service.c agent/src/updater.c agent/src/provenance_windows.c \
            agent/windows/wfp_user.c \
            -lws2_32 -lwinhttp -liphlpapi -ladvapi32 -lbcrypt -lcrypt32 -lncrypt \
            -lfwpuclnt -lole32

  build-packages:
    name: Cross-Platform Release Packaging
    runs-on: ubuntu-latest
    needs: [version-consistency, test-hub, test-agents]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Packaging Utilities (dpkg-dev, wixl, mingw-w64, curl)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev wixl mingw-w64 libcurl4-openssl-dev

      - name: Build Cross-Platform Packages
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/build-packages.sh

      - name: Verify Native Package Identities
        run: |
          dpkg-deb --field dist/ominull-agent_*.deb Package Version Architecture
          dpkg-deb --field dist/ominull-hub_*.deb Package Version Architecture
          command -v msidump
          msidump -t File dist/ominull-agent-windows-*.msi >/dev/null
