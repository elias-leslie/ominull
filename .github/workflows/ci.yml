name: Ominull CI Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  version-consistency:
    name: Release Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The hub, the three agents, and the package filenames must all agree, or the
      # fleet is offered a self-update package the hub cannot serve.
      - name: Verify every version site matches VERSION
        run: |
          chmod +x ./scripts/version.sh
          ./scripts/version.sh check

  test-hub:
    name: Go Hub Unit & Behavioral Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: hub/go.sum

      - name: Run Go Test Suite
        run: |
          cd hub
          go test -v -race ./...

  test-agent-dpi:
    name: C Agent & Stream DPI Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile and Test DPI Parser
        run: |
          gcc -O2 -Wall -Wextra -o /tmp/test_dpi agent/tests/test_dpi.c
          /tmp/test_dpi

      - name: Compile Linux Native Agent
        run: |
          mkdir -p agent/bin
          gcc -O2 -Wall -Wextra -o agent/bin/ominull-agent agent/linux/main.c

      - name: Install mingw-w64 Cross Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64

      - name: Compile Windows Native Agent
        run: |
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -o agent/bin/ominulld.exe \
            agent/src/main.c agent/src/hub_client.c agent/src/service.c agent/src/driver_client.c \
            -lws2_32 -lwinhttp -liphlpapi -ladvapi32

  build-packages:
    name: Cross-Platform Release Packaging
    runs-on: ubuntu-latest
    needs: [version-consistency, test-hub, test-agent-dpi]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # mingw-w64 builds the Windows agent. Without it the bundle used to ship an
      # installer with no binary, which is why the fleet could not take a Windows update.
      - name: Install Packaging Utilities (dpkg-dev, zip, mingw-w64)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev zip mingw-w64

      - name: Build Cross-Platform Packages
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/build-packages.sh

      - name: Verify SHA256 Checksums
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
