[package]
name = "screen-wire"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Ominull remote-screen wire protocol (REMOTE_SCREEN.md §4): the one shared schema for the Rust helper and the native viewer. Platform-neutral."
license = "BSL-1.1"
publish = false

[lib]
name = "screen_wire"
path = "src/lib.rs"

[dependencies]
# Platform-neutral by design: no `windows` crate, nothing OS-specific, so both
# the SYSTEM helper and the viewer client link it. MIT/Apache-2.0.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
